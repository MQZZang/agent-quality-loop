name: validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Manifest generation safety regression cases
        run: node scripts/gen-manifest.js --self-test

      - name: Installer routing and atomic-preflight regression cases
        run: node scripts/install.js --self-test

      - name: Envelope statistics aggregation cases
        run: node scripts/aql-stats.js --self-test

      - name: Skill package structure and envelope regression cases
        run: node .cursor/skills/agent-quality-loop/scripts/validate-skill.js

      - name: Routing, adapter policies, and public docs
        run: node scripts/validate-workflow.js

      - name: Cursor hooks protocol tests
        run: node integrations/cursor-hooks/test.js

      # sync-skills.js --check compares mirrors and manifest hashes without rewriting.
      - name: Codex mirror matches the Cursor source
        run: node scripts/sync-skills.js --check
